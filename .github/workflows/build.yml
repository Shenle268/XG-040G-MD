# ImmortalWrt 云编译：Nokia XG-040G-MD (UBI) + airoha PPE offload 修复补丁
# 用法：
#   1. 在 GitHub 新建一个仓库，把本文件放到 .github/workflows/build.yml
#   2. 把 airoha-ppe-keep-offload.patch 放到仓库根目录的 patches/ 下
#   3. 仓库页面 Actions -> Build XG-040G-MD -> Run workflow
#   4. 约 2-4 小时后在 Artifacts 下载 sysupgrade 镜像

name: Build XG-040G-MD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出本仓库（拿 patches）
        uses: actions/checkout@v4

      - name: 清理磁盘（编译需要约 20GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig unzip \
            zlib1g-dev file wget xsltproc

      - name: 拉取 ImmortalWrt 源码
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git owrt
          cd owrt && git log --oneline -1

      - name: 注入 PPE offload 修复补丁
        run: |
          cp patches/airoha-ppe-keep-offload.patch owrt/target/linux/airoha/patches-6.18/999-airoha-ppe-keep-offload.patch
          ls owrt/target/linux/airoha/patches-6.18/ | tail -3

      - name: 更新 feeds
        run: |
          cd owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置（只选这一个设备）
        run: |
          cd owrt
          echo 'CONFIG_TARGET_airoha=y' > .config
          echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' >> .config
          make defconfig
          grep -E 'CONFIG_TARGET_airoha|DEVICE_nokia' .config | head

      - name: 下载源码包
        run: cd owrt && make download -j8 || make download -j1 V=s

      - name: 编译
        run: cd owrt && make -j$(nproc) || make -j1 V=s

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-xg-040g-md
          path: |
            owrt/bin/targets/airoha/an7581/*sysupgrade*
            owrt/bin/targets/airoha/an7581/*.itb
            owrt/bin/targets/airoha/an7581/sha256sums
          if-no-files-found: error
